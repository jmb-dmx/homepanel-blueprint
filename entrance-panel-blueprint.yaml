  - id: update_weather_ui
    then:
      - lvgl.label.update:
          id: lbl_weather_condition
          text: !lambda |-
            std::string x = id(weather_cond);
            if (x == "sunny")            return std::string("\U000F0599");
            if (x == "clear-night")      return std::string("\U000F0594");
            if (x == "partlycloudy")     return std::string("\U000F0595");
            if (x == "cloudy")           return std::string("\U000F0590");
            if (x == "rainy")            return std::string("\U000F0597");
            if (x == "snowy")            return std::string("\U000F0598");
            if (x == "lightning")        return std::string("\U000F0593");
            if (x == "lightning-rainy")  return std::string("\U000F067E");
            if (x == "windy")            return std::string("\U000F059D");
            if (x == "fog")              return std::string("\U000F0591");
            return std::string("\U000F0590");
      - lvgl.label.update:
          id: lbl_temperature
          text: !lambda |-
            std::string x = id(weather_temp);
            if (x == "unavailable" || x == "unknown" || x == "") return std::string("-- °C");
            if (x.find("°") != std::string::npos) return x;
            return x + std::string(" °C");
      - lvgl.label.update:
          id: lbl_icon_demain
          text: !lambda |-
            std::string x = id(weather_cond_demain);
            if (x == "sunny") return std::string("\U000F0599");
            if (x == "partlycloudy") return std::string("\U000F0595");
            if (x == "cloudy") return std::string("\U000F0590");
            if (x == "rainy") return std::string("\U000F0597");
            if (x == "snowy") return std::string("\U000F0598");
            if (x == "lightning" || x == "lightning-rainy") return std::string("\U000F0593");
            return std::string("\U000F0590");
      - lvgl.label.update:
          id: lbl_max_demain
          text: !lambda 'return id(weather_max_demain) + std::string("°C");'
      - lvgl.label.update:
          id: lbl_min_demain
          text: !lambda 'return id(weather_min_demain) + std::string("°C");'
      - lvgl.label.update:
          id: lbl_icon_apres_demain
          text: !lambda |-
            std::string x = id(weather_cond_apres_demain);
            if (x == "sunny") return std::string("\U000F0599");
            if (x == "partlycloudy") return std::string("\U000F0595");
            if (x == "cloudy") return std::string("\U000F0590");
            if (x == "rainy") return std::string("\U000F0597");
            if (x == "snowy") return std::string("\U000F0598");
            if (x == "lightning" || x == "lightning-rainy") return std::string("\U000F0593");
            return std::string("\U000F0590");
      - lvgl.label.update:
          id: lbl_max_apres_demain
          text: !lambda 'return id(weather_max_apres_demain) + std::string("°C");'
      - lvgl.label.update:
          id: lbl_min_apres_demain
          text: !lambda 'return id(weather_min_apres_demain) + std::string("°C");'
  - id: update_media_ui
    then:
      - lvgl.label.update:
          id: lbl_media_song
          text: !lambda |-
            std::string m = id(selected_media_id);
            std::string t = "";
            if (m == id(media_1_entity_id)) t = id(media_1_title);
            else if (m == id(media_2_entity_id)) t = id(media_2_title);
            else if (m == id(media_3_entity_id)) t = id(media_3_title);
            if (t == "" || t == "unavailable" || t == "unknown") return std::string("Aucun titre en lecture");
            return t;
      - lvgl.label.update:
          id: lbl_media_artist
          text: !lambda |-
            std::string m = id(selected_media_id);
            std::string a = "";
            if (m == id(media_1_entity_id)) a = id(media_1_artist);
            else if (m == id(media_2_entity_id)) a = id(media_2_artist);
            else if (m == id(media_3_entity_id)) a = id(media_3_artist);
            if (a == "" || a == "unavailable" || a == "unknown") return std::string("");
            return a;
      - lvgl.label.update:
          id: lbl_media_playpause
          text: !lambda |-
            std::string m = id(selected_media_id);
            std::string s = "";
            if (m == id(media_1_entity_id)) s = id(media_1_state);
            else if (m == id(media_2_entity_id)) s = id(media_2_state);
            else if (m == id(media_3_entity_id)) s = id(media_3_state);
            if (s == "playing") return std::string("\U000F03E4");
            return std::string("\U000F040A");
################################################################################
# Core services
################################################################################
logger:
  level: WARN
  hardware_uart: USB_SERIAL_JTAG
api:
  on_client_connected:
    - delay: 5s
    - homeassistant.event:
        event: esphome.entrance_panel_request_config
  services:
    - service: set_weather
      variables:
        cond: string
        temp: string
        cond_d1: string
        max_d1: string
        min_d1: string
        cond_d2: string
        max_d2: string
        min_d2: string
      then:
        - lambda: |-
            id(weather_cond) = cond;
            id(weather_temp) = temp;
            id(weather_cond_demain) = cond_d1;
            id(weather_max_demain) = max_d1;
            id(weather_min_demain) = min_d1;
            id(weather_cond_apres_demain) = cond_d2;
            id(weather_max_apres_demain) = max_d2;
            id(weather_min_apres_demain) = min_d2;
        - script.execute: update_weather_ui
    - service: set_media
      variables:
        player: int
        entity_id: string
        state: string
        title: string
        artist: string
      then:
        - lambda: |-
            if (player == 1) {
              id(media_1_entity_id) = entity_id;
              id(media_1_state) = state;
              id(media_1_title) = title;
              id(media_1_artist) = artist;
            } else if (player == 2) {
              id(media_2_entity_id) = entity_id;
              id(media_2_state) = state;
              id(media_2_title) = title;
              id(media_2_artist) = artist;
            } else if (player == 3) {
              id(media_3_entity_id) = entity_id;
              id(media_3_state) = state;
              id(media_3_title) = title;
              id(media_3_artist) = artist;
            }
            if (id(selected_media_id) == "media_player." + std::to_string(player)) {
               id(selected_media_id) = entity_id;
            }
        - script.execute: update_media_ui
    - service: set_qr
      variables:
        qr_text: string
      then:
        - lambda: 'id(guest_wifi_qr) = qr_text;'
        - lvgl.qrcode.update:
            id: my_qr_code
            text: !lambda 'return id(guest_wifi_qr).c_str();'
    - service: set_button_config
      variables:
        button: int
        name: string
        icon: string
        action: string
        entity: string
      then:
        - lambda: |-
            if (button == 1) {
              id(btn1_name).publish_state(name);
              id(btn1_icon).publish_state(icon);
              id(btn1_type).publish_state(action);
              id(btn1_entity).publish_state(entity);
            } else if (button == 2) {
              id(btn2_name).publish_state(name);
              id(btn2_icon).publish_state(icon);
              id(btn2_type).publish_state(action);
              id(btn2_entity).publish_state(entity);
            } else if (button == 3) {
              id(btn3_name).publish_state(name);
              id(btn3_icon).publish_state(icon);
              id(btn3_type).publish_state(action);
              id(btn3_entity).publish_state(entity);
            } else if (button == 4) {
              id(btn4_name).publish_state(name);
              id(btn4_icon).publish_state(icon);
              id(btn4_type).publish_state(action);
              id(btn4_entity).publish_state(entity);
            } else if (button == 5) {
              id(btn5_name).publish_state(name);
              id(btn5_icon).publish_state(icon);
              id(btn5_type).publish_state(action);
              id(btn5_entity).publish_state(entity);
            } else if (button == 6) {
              id(btn6_name).publish_state(name);
              id(btn6_icon).publish_state(icon);
              id(btn6_type).publish_state(action);
              id(btn6_entity).publish_state(entity);
            } else if (button == 7) {
              id(btn7_name).publish_state(name);
              id(btn7_icon).publish_state(icon);
              id(btn7_type).publish_state(action);
              id(btn7_entity).publish_state(entity);
            } else if (button == 8) {
              id(btn8_name).publish_state(name);
              id(btn8_icon).publish_state(icon);
              id(btn8_type).publish_state(action);
              id(btn8_entity).publish_state(entity);
            }
        - script.execute: sync_button_states
ota:
wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_pwd}"
  output_power: 17
  power_save_mode: NONE
  reboot_timeout: 5min
  ap:
    ssid: "${device_name}-fallback"
captive_portal:
time:
  - platform: homeassistant
    id: ha_time
i2c:
  sda: GPIO08
  scl: GPIO09
  scan: true
  id: bus_a
ch422g:
  - id: ch422g_hub
light:
  - platform: binary
    id: lcd_backlight
    output: backlight_out
output:
  - platform: gpio
    id: backlight_out
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false
################################################################################
# ── HA SENSOR IMPORTS
################################################################################
text_sensor:
  - platform: homeassistant

    id: notification_sensor

    entity_id: input_text.dashboard_notification

    on_value:

      then:

        - lvgl.label.update:

            id: lbl_notification_text

            text: !lambda 'return x;'

        - lambda: |-

            if (x != "" && x != "unavailable" && x != "unknown") {

              lv_obj_clear_flag(id(notification_card), LV_OBJ_FLAG_HIDDEN);

              lv_obj_add_flag(id(main_btn1), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(main_btn2), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(main_btn3), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(main_btn4), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(main_btn5), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(main_btn6), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(main_btn7), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(main_btn8), LV_OBJ_FLAG_HIDDEN);

              lv_obj_clear_flag(id(lbl_screensaver_notification), LV_OBJ_FLAG_HIDDEN);

            }
  - platform: wifi_info
    ip_address:
      id: ip_address_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_ip_address
              text: !lambda 'return std::string("IP : ") + x;'
sensor:
  - platform: wifi_signal
    name: "Dashboard WiFi Signal"
    update_interval: 60s
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_wifi
            text: !lambda |-
              if (x > -60) return std::string("\U000F05A9");
              if (x > -75) return std::string("\U000F05A7");
              if (x > -85) return std::string("\U000F05A6");
              return std::string("\U000F05A5");
