          else if (id(screensaver_mode) == 1) lv_obj_add_state(id(btn_screensaver_clock), LV_STATE_CHECKED);

          if (id(show_media_on_screensaver) == 1) lv_obj_add_state(id(btn_screensaver_media_yes), LV_STATE_CHECKED);
          else if (id(show_media_on_screensaver) == 0) lv_obj_add_state(id(btn_screensaver_media_no), LV_STATE_CHECKED);

          if (id(screensaver_clock_size) == 0) lv_obj_add_state(id(btn_clock_size_small), LV_STATE_CHECKED);
          else if (id(screensaver_clock_size) == 1) lv_obj_add_state(id(btn_clock_size_medium), LV_STATE_CHECKED);
          else if (id(screensaver_clock_size) == 2) lv_obj_add_state(id(btn_clock_size_large), LV_STATE_CHECKED);

          lv_style_set_border_color(id(style_setting_btn_checked), lv_color_make(id(theme_r), id(theme_g), id(theme_b)));
          lv_obj_report_style_change(id(style_setting_btn_checked));

          if (id(screensaver_clock_size) == 0) lv_obj_set_style_text_font(id(lbl_screensaver_clock), id(font_clock), 0);
          else if (id(screensaver_clock_size) == 1) lv_obj_set_style_text_font(id(lbl_screensaver_clock), id(font_clock_large), 0);
          else if (id(screensaver_clock_size) == 2) lv_obj_set_style_text_font(id(lbl_screensaver_clock), id(font_clock_xlarge), 0);
  - id: reset_sleep_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(sleep_delay_s) > 0;'
          then:
            - delay: !lambda 'return id(sleep_delay_s) * 1000;'
            - if:
                condition:
                  lambda: 'return id(screensaver_mode) == 1;'
                then:
                  - lambda: 'id(current_page) = 99;'
                  - lvgl.page.show: screensaver_page
                else:
                  - light.turn_off: lcd_backlight
  - id: auto_return_timer
    mode: restart
    then:
      - delay: 10s
      - lambda: 'id(current_page) = 0;'
      - script.execute: sync_button_states
      - lvgl.page.show: main_page
  - id: apply_brightness
    mode: restart
    then:
      - delay: 150ms
      - homeassistant.action:
          action: light.turn_on
          data_template:
            entity_id: "{{ tgt }}"
            brightness_pct: "{{ bright }}"
          variables:
            tgt: !lambda 'return id(selected_light_id);'
            bright: !lambda 'return id(pending_brightness);'
  - id: apply_color_temp
    mode: restart
    then:
      - delay: 150ms
      - homeassistant.action:
          action: light.turn_on
          data_template:
            entity_id: "{{ tgt }}"
            color_temp_kelvin: "{{ temp }}"
          variables:
            tgt: !lambda 'return id(selected_light_id);'
            temp: !lambda 'return id(pending_temp);'
  - id: apply_rgb
    mode: restart
    then:
      - delay: 150ms
      - homeassistant.action:
          action: light.turn_on
          data_template:
            entity_id: "{{ tgt }}"
            rgb_color: "[{{ r }}, {{ g }}, {{ b }}]"
          variables:
            tgt: !lambda 'return id(selected_light_id);'
            r: !lambda 'return id(pending_r);'
            g: !lambda 'return id(pending_g);'
            b: !lambda 'return id(pending_b);'
  - id: init_slider_colors
    then:
      - lambda: |-
          float temp = id(pending_temp);
          float pct = (temp - 2700.0) / (6500.0 - 2700.0);
          uint8_t r, g, b;
          if (pct <= 0.5) {
            float p = pct / 0.5;
            r = 255;
            g = 160 + (95 * p);
            b = 255 * p;
          } else {
            float p = (pct - 0.5) / 0.5;
            r = 255 - (95 * p);
            g = 255 - (55 * p);
            b = 255;
          }
          lv_obj_set_style_bg_color(id(slider_temp), lv_color_make(r, g, b), LV_PART_KNOB);
          lv_obj_set_style_bg_color(id(slider_temp), lv_color_make(r, g, b), LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(slider_r), lv_color_make(id(pending_r), 0, 0), LV_PART_KNOB);
          lv_obj_set_style_bg_color(id(slider_r), lv_color_make(id(pending_r), 0, 0), LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(slider_g), lv_color_make(0, id(pending_g), 0), LV_PART_KNOB);
          lv_obj_set_style_bg_color(id(slider_g), lv_color_make(0, id(pending_g), 0), LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(slider_b), lv_color_make(0, 0, id(pending_b)), LV_PART_KNOB);
          lv_obj_set_style_bg_color(id(slider_b), lv_color_make(0, 0, id(pending_b)), LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(slider_bright), lv_color_make(id(theme_r), id(theme_g), id(theme_b)), LV_PART_KNOB);
          lv_obj_set_style_bg_color(id(slider_bright), lv_color_make(id(theme_r), id(theme_g), id(theme_b)), LV_PART_INDICATOR);
  # --- SCRIPTS DU LECTEUR MULTIMÉDIA (CORRIGÉS POUR HOME ASSISTANT) ---
  - id: media_play_pause
    then:
      - homeassistant.action:
          action: media_player.media_play_pause
          data_template:
            entity_id: "{{ tgt }}"
          variables:
            tgt: !lambda 'return id(selected_media_id);'
  - id: media_stop
    then:
      - homeassistant.action:
          action: media_player.media_stop
          data_template:
            entity_id: "{{ tgt }}"
          variables:
            tgt: !lambda 'return id(selected_media_id);'
  - id: media_next
    then:
