  - id: col_blue
    hex: "60A5FA"
################################################################################
# Display & Touch
################################################################################
display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 14MHz
    dimensions:
      width: 800
      height: 480
    de_pin: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch:  8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch:  16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]
touchscreen:
  platform: gt911
  id: my_touch
  display: my_display
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  on_touch:
    - light.turn_on: lcd_backlight
    - script.execute: reset_sleep_timer
    # Attention: le retour automatique ne s'applique PAS à la page 7 (Media Player)
    - if:
        condition:
          lambda: 'return id(current_page) > 0 && id(current_page) < 7;'
        then:
          - script.execute: auto_return_timer
    - if:
        condition:
          lambda: 'return id(current_page) == 99;'
        then:
          - lambda: 'id(current_page) = 0;'
          - script.execute: sync_button_states
          - lvgl.page.show: main_page
################################################################################
# LVGL — UI avec 7 pages
################################################################################
lvgl:
  on_boot:
    - lambda: |-
        lv_anim_t a;
        lv_anim_init(&a);
        lv_anim_set_var(&a, id(lbl_screensaver_notification));
        lv_anim_set_values(&a, 255, 50);
        lv_anim_set_time(&a, 2000);
        lv_anim_set_playback_time(&a, 2000);
        lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
        lv_anim_set_exec_cb(&a, [](void * var, int32_t v) {
            lv_obj_set_style_text_opa((lv_obj_t *)var, v, 0);
        });
        lv_anim_start(&a);
  color_depth: 16
  buffer_size: 15%
  log_level: WARN
  bg_color: col_bg
  text_font: font_btn
  width:  800
  height: 480
  touchscreens:
    - touchscreen_id: my_touch
  style_definitions:
    - id: style_light_btn
      radius: 12
      border_width: 2
      border_color: col_divider
      bg_color: col_btn_off
      bg_opa: COVER
      text_color: col_text_primary
      pad_all: 8
    - id: style_light_btn_checked
      bg_color: col_btn_on
      border_color: col_accent
    - id: style_scene_btn
      radius: 12
      border_width: 2
      border_color: col_divider
      bg_color: col_scene_btn
      bg_opa: COVER
      text_color: col_text_primary
      pad_all: 8
    - id: style_scene_btn_pressed
      bg_color: col_scene_active
      border_color: col_accent
    - id: style_scene_btn_checked
      bg_color: col_btn_on
      border_color: col_accent
    - id: style_section_heading
      text_color: col_text_secondary
      text_font: font_heading
      bg_opa: TRANSP
      border_opa: TRANSP
      pad_bottom: 4
    - id: style_setting_btn_checked
      bg_color: col_scene_btn
      bg_opa: COVER
      border_width: 2
      border_color: col_accent
      text_color: col_text_primary
