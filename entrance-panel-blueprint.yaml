                  text_color: col_text_primary
                  text: "Lumière"
        - label:
            x: 40
            y: 90
            styles: style_section_heading
            text: "LUMINOSITÉ (%)"
        - slider:
            id: slider_bright
            x: 40
            y: 120
            width: 720
            height: 20
            min_value: 0
            max_value: 100
            value: 50
            on_value:
              - script.execute: auto_return_timer
              - lambda: 'id(pending_brightness) = x;'
              - script.execute: apply_brightness
        - label:
            x: 40
            y: 160
            styles: style_section_heading
            text: "TEMPÉRATURE DE COULEUR (K)"
        - slider:
            id: slider_temp
            x: 40
            y: 190
            width: 720
            height: 20
            min_value: 2700
            max_value: 6500
            value: 4000
            on_value:
              - script.execute: auto_return_timer
              - lambda: 'id(pending_temp) = x;'
              - script.execute: apply_color_temp
              - lambda: |-
                  float pct = (x - 2700.0) / (6500.0 - 2700.0);
                  uint8_t r, g, b;
                  if (pct <= 0.5) {
                    float p = pct / 0.5;
                    r = 255;
                    g = 160 + (95 * p);
                    b = 255 * p;
                  } else {
                    float p = (pct - 0.5) / 0.5;
                    r = 255 - (95 * p);
                    g = 255 - (55 * p);
                    b = 255;
                  }
                  lv_obj_set_style_bg_color(id(slider_temp), lv_color_make(r, g, b), LV_PART_KNOB);
