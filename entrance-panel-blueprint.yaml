################################################################################
#  Waveshare ESP32-S3-Touch-LCD-7  —  Home Dashboard
#  ESPHome firmware - V3.1 PRO (100% Web + Menus Déroulants Entités & Icônes)
################################################################################
substitutions:
  device_name:  entrance-dashboard
  friendly_name:  "Entrance Dashboard"
  wifi_ssid: "BELL685"
  wifi_pwd: "1739EC3C"
  wifi_qr: "WIFI:S:BELL685;T:WPA;P:1739EC3C;;"
################################################################################
# Board & framework
################################################################################
esphome:
  name: entrance-panel
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi
    board_build.flash_mode: dio
    board_upload.maximum_ram_size: 524288
    board_upload.maximum_size: 8388608
  on_boot:
    priority: -10
    then:
      - light.turn_on: lcd_backlight
      - lambda: 'id(current_page) = 0;'
      - lvgl.page.show: main_page
      - script.execute: sync_button_states
      - script.execute: reset_sleep_timer
      - script.execute: init_slider_colors
      - lambda: |-
          lv_style_set_bg_color(id(style_light_btn_checked), lv_color_make(id(theme_r), id(theme_g), id(theme_b)));
          lv_style_set_bg_color(id(style_scene_btn_checked), lv_color_make(id(theme_r), id(theme_g), id(theme_b)));
          lv_obj_report_style_change(id(style_light_btn_checked));
          lv_obj_report_style_change(id(style_scene_btn_checked));

          if (id(theme_r) == 217 && id(theme_g) == 119) {
            lv_obj_add_state(id(btn_color_orange), LV_STATE_CHECKED);
          } else if (id(theme_r) == 59 && id(theme_g) == 130) {
            lv_obj_add_state(id(btn_color_blue), LV_STATE_CHECKED);
          } else if (id(theme_r) == 16 && id(theme_g) == 185) {
            lv_obj_add_state(id(btn_color_green), LV_STATE_CHECKED);
          }
psram:
  mode: octal
  speed: 80MHz
esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DATA_CACHE_64KB:         "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB:         "y"
      CONFIG_FREERTOS_HZ:                     "1000"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240:    "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS:       y
      CONFIG_SPIRAM_RODATA:                   y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B:     y
      CONFIG_LCD_RGB_ISR_IRAM_SAFE:           y
      CONFIG_LCD_RGB_RESTART_IN_VSYNC:        y
      CONFIG_ESP_WIFI_IRAM_OPT:              y
      CONFIG_ESP_WIFI_RX_IRAM_OPT:           y
      CONFIG_LWIP_IRAM_OPTIMIZATION:          y
################################################################################
# Serveur Web
################################################################################
web_server:
  port: 80
  version: 3
  local: true
