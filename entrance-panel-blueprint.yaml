################################################################################
# Clock interval & Updates Dynamiques
################################################################################
interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_screensaver_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            auto t = id(ha_time).now();
            static const char* days[]   = {"Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"};
            static const char* months[] = {"Janvier","Février","Mars","Avril","Mai","Juin",
                                            "Juillet","Août","Septembre","Octobre","Novembre","Décembre"};
            char buf[40];
            snprintf(buf, sizeof(buf), "%s, %d %s", days[t.day_of_week - 1], t.day_of_month, months[t.month - 1]);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_screensaver_date
          text: !lambda |-
            auto t = id(ha_time).now();
            static const char* days[]   = {"Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"};
            static const char* months[] = {"Janvier","Février","Mars","Avril","Mai","Juin",
                                            "Juillet","Août","Septembre","Octobre","Novembre","Décembre"};
            char buf[40];
            snprintf(buf, sizeof(buf), "%s, %d %s", days[t.day_of_week - 1], t.day_of_month, months[t.month - 1]);
            return std::string(buf);
      # UPDATE DU TEXTE SUR L'ÉCRAN DE VEILLE (Seulement si sur page 99 et activé)
      - if:
          condition:
            lambda: 'return id(current_page) == 99 && id(show_media_on_screensaver) == 1;'
          then:
            - lvgl.label.update:
                id: lbl_screensaver_media
                text: !lambda |-
                  std::string m = id(selected_media_id);
                  std::string state = "";
                  std::string t = "";
                  std::string a = "";
                  if (m == id(media_1_entity_id)) { state = id(media_1_state); t = id(media_1_title); a = id(media_1_artist); }
                  else if (m == id(media_2_entity_id)) { state = id(media_2_state); t = id(media_2_title); a = id(media_2_artist); }
                  else if (m == id(media_3_entity_id)) { state = id(media_3_state); t = id(media_3_title); a = id(media_3_artist); }
                  if (state == "playing" && t != "" && t != "unavailable" && t != "unknown") {
                      if (a != "" && a != "unknown") {
                          return t + " - " + a;
                      } else {
                          return t;
                      }
                  }
                  return std::string("");
          else:
            - lvgl.label.update:
                id: lbl_screensaver_media
                text: ""