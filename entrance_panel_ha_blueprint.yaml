      description: 'Name to display in the dropdown list for Media Player 3'
      default: "Lecteur 3"
      selector:
        text:
    guest_wifi_ssid:
      name: Guest Wi-Fi SSID
      description: 'The network name (SSID)'
      default: ""
      selector:
        text:
    guest_wifi_pwd:
      name: Guest Wi-Fi Password
      description: 'The network password'
      default: ""
      selector:
        text:

mode: parallel
max: 10

variables:
  guest_wifi_ssid: !input guest_wifi_ssid
  guest_wifi_pwd: !input guest_wifi_pwd
  panel_device_id: !input panel_device
  panel_name: !input esphome_node_name
  button_1_type: !input button_1_type
  button_2_type: !input button_2_type
  button_3_type: !input button_3_type
  button_4_type: !input button_4_type
  button_5_type: !input button_5_type
  button_6_type: !input button_6_type
  button_7_type: !input button_7_type
  button_8_type: !input button_8_type
  weather_entity: !input weather_entity
  outdoor_temp_entity: !input outdoor_temp_entity
  media_player_1: !input media_player_1
  media_player_2: !input media_player_2
  media_player_3: !input media_player_3
  media_player_1_name: !input media_player_1_name
  media_player_2_name: !input media_player_2_name
  media_player_3_name: !input media_player_3_name

trigger:
  - platform: homeassistant
    event: start
    id: init_panel
  - platform: event
    event_type: automation_reloaded
    id: init_panel
  - platform: event
    event_type: esphome.entrance_panel_request_config
    id: init_panel
  - platform: state
    entity_id: !input weather_entity
    id: sync_weather
  - platform: state
    entity_id: !input outdoor_temp_entity
    id: sync_weather
  - platform: state
    entity_id: !input media_player_1
    id: sync_media_1
  - platform: state
    entity_id: !input media_player_2
    id: sync_media_2
  - platform: state
    entity_id: !input media_player_3
    id: sync_media_3

action:
  - choose:
      - conditions:
          - or:
              - condition: template
                value_template: "{{ trigger is undefined }}"
              - condition: trigger
                id: init_panel
        sequence:
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 1
              name: !input button_1_name
              icon: !input button_1_icon
              action: !input button_1_type
              entity: !input button_1_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 2
              name: !input button_2_name
              icon: !input button_2_icon
              action: !input button_2_type
              entity: !input button_2_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 3
              name: !input button_3_name
              icon: !input button_3_icon
              action: !input button_3_type
              entity: !input button_3_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 4
              name: !input button_4_name
              icon: !input button_4_icon
              action: !input button_4_type
              entity: !input button_4_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 5
              name: !input button_5_name
              icon: !input button_5_icon
              action: !input button_5_type
              entity: !input button_5_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 6
              name: !input button_6_name
              icon: !input button_6_icon
              action: !input button_6_type
              entity: !input button_6_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 7
              name: !input button_7_name
              icon: !input button_7_icon
              action: !input button_7_type
              entity: !input button_7_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 8
              name: !input button_8_name
              icon: !input button_8_icon
              action: !input button_8_type
              entity: !input button_8_entity
          - service: "esphome.{{ panel_name }}_set_media_options"
            data:
              options_str: "{{ media_player_1_name }}\n{{ media_player_2_name }}\n{{ media_player_3_name }}"
          - service: "esphome.{{ panel_name }}_set_qr"
            data:
              qr_text: "WIFI:S:{{ guest_wifi_ssid }};T:WPA;P:{{ guest_wifi_pwd }};;"
          - service: weather.get_forecasts
            data:
              type: daily
            target:
              entity_id: "{{ weather_entity }}"
            response_variable: weather_forecast
          - service: "esphome.{{ panel_name }}_set_weather"
            data:
              cond: "{{ states(weather_entity) }}"
              temp: "{{ states(outdoor_temp_entity) }}"
              cond_d1: "{{ weather_forecast[weather_entity]['forecast'][0]['condition'] if weather_forecast[weather_entity]['forecast'] else '' }}"
              max_d1: "{{ weather_forecast[weather_entity]['forecast'][0]['temperature'] | string if weather_forecast[weather_entity]['forecast'] else '' }}"
              min_d1: "{{ weather_forecast[weather_entity]['forecast'][0]['templow'] | string if weather_forecast[weather_entity]['forecast'] else '' }}"
              cond_d2: "{{ weather_forecast[weather_entity]['forecast'][1]['condition'] if weather_forecast[weather_entity]['forecast'] and weather_forecast[weather_entity]['forecast'] | length > 1 else '' }}"
              max_d2: "{{ weather_forecast[weather_entity]['forecast'][1]['temperature'] | string if weather_forecast[weather_entity]['forecast'] and weather_forecast[weather_entity]['forecast'] | length > 1 else '' }}"
              min_d2: "{{ weather_forecast[weather_entity]['forecast'][1]['templow'] | string if weather_forecast[weather_entity]['forecast'] and weather_forecast[weather_entity]['forecast'] | length > 1 else '' }}"
          - service: "esphome.{{ panel_name }}_set_media"
            data:
              player: 1
              entity_id: "{{ media_player_1 }}"
              state: "{{ states(media_player_1) }}"
              title: "{{ state_attr(media_player_1, 'media_title') | default('', true) }}"
              artist: "{{ state_attr(media_player_1, 'media_artist') | default('', true) }}"
          - service: "esphome.{{ panel_name }}_set_media"
            data:
              player: 2
              entity_id: "{{ media_player_2 }}"
              state: "{{ states(media_player_2) }}"
              title: "{{ state_attr(media_player_2, 'media_title') | default('', true) }}"
              artist: "{{ state_attr(media_player_2, 'media_artist') | default('', true) }}"
          - service: "esphome.{{ panel_name }}_set_media"
            data:
              player: 3
              entity_id: "{{ media_player_3 }}"
              state: "{{ states(media_player_3) }}"
              title: "{{ state_attr(media_player_3, 'media_title') | default('', true) }}"
              artist: "{{ state_attr(media_player_3, 'media_artist') | default('', true) }}"
      - conditions:
          - condition: trigger
            id: sync_weather
        sequence:
          - service: weather.get_forecasts
            data:
              type: daily
            target:
              entity_id: "{{ weather_entity }}"
            response_variable: weather_forecast
          - service: "esphome.{{ panel_name }}_set_weather"
            data:
              cond: "{{ states(weather_entity) }}"
              temp: "{{ states(outdoor_temp_entity) }}"
              cond_d1: "{{ weather_forecast[weather_entity]['forecast'][0]['condition'] if weather_forecast[weather_entity]['forecast'] else '' }}"
              max_d1: "{{ weather_forecast[weather_entity]['forecast'][0]['temperature'] | string if weather_forecast[weather_entity]['forecast'] else '' }}"
              min_d1: "{{ weather_forecast[weather_entity]['forecast'][0]['templow'] | string if weather_forecast[weather_entity]['forecast'] else '' }}"
              cond_d2: "{{ weather_forecast[weather_entity]['forecast'][1]['condition'] if weather_forecast[weather_entity]['forecast'] and weather_forecast[weather_entity]['forecast'] | length > 1 else '' }}"
              max_d2: "{{ weather_forecast[weather_entity]['forecast'][1]['temperature'] | string if weather_forecast[weather_entity]['forecast'] and weather_forecast[weather_entity]['forecast'] | length > 1 else '' }}"
              min_d2: "{{ weather_forecast[weather_entity]['forecast'][1]['templow'] | string if weather_forecast[weather_entity]['forecast'] and weather_forecast[weather_entity]['forecast'] | length > 1 else '' }}"
      - conditions:
          - condition: trigger
            id: sync_media_1
        sequence:
          - service: "esphome.{{ panel_name }}_set_media"
            data:
              player: 1
              entity_id: "{{ media_player_1 }}"
              state: "{{ states(media_player_1) }}"
              title: "{{ state_attr(media_player_1, 'media_title') | default('', true) }}"
              artist: "{{ state_attr(media_player_1, 'media_artist') | default('', true) }}"
      - conditions:
          - condition: trigger
            id: sync_media_2
        sequence:
          - service: "esphome.{{ panel_name }}_set_media"
            data:
              player: 2
              entity_id: "{{ media_player_2 }}"
              state: "{{ states(media_player_2) }}"
              title: "{{ state_attr(media_player_2, 'media_title') | default('', true) }}"
              artist: "{{ state_attr(media_player_2, 'media_artist') | default('', true) }}"
      - conditions:
          - condition: trigger
            id: sync_media_3
        sequence:
          - service: "esphome.{{ panel_name }}_set_media"
            data:
              player: 3
              entity_id: "{{ media_player_3 }}"
              state: "{{ states(media_player_3) }}"
              title: "{{ state_attr(media_player_3, 'media_title') | default('', true) }}"
              artist: "{{ state_attr(media_player_3, 'media_artist') | default('', true) }}"
