mode: parallel
max: 10

variables:
  panel_device_id: !input panel_device
  panel_name: !input esphome_node_name
  button_1_type: !input button_1_type
  button_2_type: !input button_2_type
  button_3_type: !input button_3_type
  button_4_type: !input button_4_type
  button_5_type: !input button_5_type
  button_6_type: !input button_6_type
  button_7_type: !input button_7_type
  button_8_type: !input button_8_type

trigger:
  - platform: homeassistant
    event: start
    id: init_panel
  - platform: event
    event_type: automation_reloaded
    id: init_panel
  - platform: event
    event_type: esphome.entrance_panel_request_config
    id: init_panel

action:
  - choose:
      - conditions:
          - or:
              - condition: template
                value_template: "{{ trigger is undefined }}"
              - condition: trigger
                id: init_panel
        sequence:
          - delay: 5
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 1
              name: !input button_1_name
              icon: !input button_1_icon
              action: !input button_1_type
              entity: !input button_1_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 2
              name: !input button_2_name
              icon: !input button_2_icon
              action: !input button_2_type
              entity: !input button_2_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 3
              name: !input button_3_name
              icon: !input button_3_icon
              action: !input button_3_type
              entity: !input button_3_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 4
              name: !input button_4_name
              icon: !input button_4_icon
              action: !input button_4_type
              entity: !input button_4_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 5
              name: !input button_5_name
              icon: !input button_5_icon
              action: !input button_5_type
              entity: !input button_5_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 6
              name: !input button_6_name
              icon: !input button_6_icon
              action: !input button_6_type
              entity: !input button_6_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 7
              name: !input button_7_name
              icon: !input button_7_icon
              action: !input button_7_type
              entity: !input button_7_entity
          - service: "esphome.{{ panel_name }}_set_button_config"
            data:
              button: 8
              name: !input button_8_name
              icon: !input button_8_icon
              action: !input button_8_type
              entity: !input button_8_entity
