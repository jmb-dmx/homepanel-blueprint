blueprint:
  name: Entrance Panel Configuration
  description: "Configure the Entrance Panel UI and buttons"
  domain: automation
  input:
    panel_device:
      name: Panel Device
      description: The ESPHome panel device.
      selector:
        device:
          integration: esphome
    esphome_node_name:
      name: ESPHome Node Name
      description: "The internal node name of the panel in ESPHome (usually entrance_panel)"
      default: "entrance_panel"
      selector:
        text:
    button_1_entity:
      name: Button 1 - Entity
      selector:
        entity:
    button_1_name:
      name: Button 1 - Name
      default: "Bouton 1"
      selector:
        text:
    button_1_icon:
      name: Button 1 - Icon
      default: "mdi:lightbulb"
      selector:
        select:
          options: ["mdi:lightbulb", "mdi:lightbulb-outline", "mdi:sofa", "mdi:silverware-fork-knife", "mdi:tree", "mdi:weather-night", "mdi:movie-open", "mdi:weather-sunset-up", "mdi:bed-empty", "mdi:home", "mdi:power", "mdi:television", "mdi:lamp", "mdi:fan", "mdi:door"]
    button_1_type:
      name: Button 1 - Action Type
      default: "light"
      selector:
        select:
          options: ["light", "script", "media_player"]
