blueprint:
  name: Entrance Panel Configuration
  description: "Configure the Entrance Panel UI and buttons"
  domain: automation
  input:
    panel_device:
      name: Panel Device
      description: The ESPHome panel device.
      selector:
        device:
          integration: esphome
    esphome_node_name:
      name: ESPHome Node Name
      description: "The internal node name of the panel in ESPHome (usually entrance_panel)"
